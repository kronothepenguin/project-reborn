#:schema https://json.schemastore.org/any.json

# make dev starts air from the repository root, so the runner reads the root
# config.json; every path below is relative to the root.
env_files = []
root = "."
testdata_dir = "testdata"
tmp_dir = "apps/installer/tmp"

[build]
args_bin = []
bin = "./apps/installer/tmp/installer"
cmd = "go build -o ./apps/installer/tmp/installer ./apps/installer/cmd/installer-dev"
delay = 1000
entrypoint = ["./apps/installer/tmp/installer"]
exclude_dir = ["apps/installer/tmp", "packages/installer/node_modules", "packages/installer/dist"]
exclude_file = []
exclude_regex = ["_test.go"]
exclude_unchanged = false
follow_symlink = false
full_bin = ""
ignore_dangerous_root_dir = false
include_dir = ["apps/installer", "packages/astro", "packages/auth", "packages/config", "packages/installer", "packages/store", "packages/virtual"]
include_ext = ["go"]
include_file = []
kill_delay = "0s"
log = "build-errors.log"
poll = false
poll_interval = 0
post_cmd = []
pre_cmd = []
rerun = false
rerun_delay = 500
send_interrupt = false
stop_on_error = false

[color]
app = ""
build = "yellow"
main = "magenta"
runner = "green"
watcher = "cyan"

[log]
main_only = false
silent = false
time = false

[misc]
clean_on_exit = false

[proxy]
app_port = 0
app_start_timeout = 0
enabled = false
proxy_port = 0

[screen]
clear_on_rebuild = false
keep_scroll = true
