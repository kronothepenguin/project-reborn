#:schema https://json.schemastore.org/any.json

# make dev starts air from the repository root, so the runner reads the root
# config.json; every path below is relative to the root.
env_files = []
root = "."
testdata_dir = "testdata"
tmp_dir = "apps/reborn/tmp"

[build]
args_bin = []
bin = "./apps/reborn/tmp/reborn"
cmd = "go build -o ./apps/reborn/tmp/reborn ./apps/reborn/cmd/reborn-dev"
delay = 1000
entrypoint = ["./apps/reborn/tmp/reborn"]
exclude_dir = ["apps/reborn/tmp", "packages/cms/node_modules", "packages/cms/dist", "packages/housekeeping/node_modules", "packages/housekeeping/dist", "packages/installer/node_modules", "packages/installer/dist", "packages/reborn/node_modules"]
exclude_file = []
exclude_regex = ["_test.go"]
exclude_unchanged = false
follow_symlink = false
full_bin = ""
ignore_dangerous_root_dir = false
include_dir = ["apps/reborn", "packages/assets", "packages/astro", "packages/auth", "packages/cms", "packages/config", "packages/housekeeping", "packages/installer", "packages/reborn", "packages/scheduler", "packages/server", "packages/services", "packages/settings", "packages/store", "packages/virtual"]
include_ext = ["go"]
include_file = []
kill_delay = "0s"
log = "build-errors.log"
poll = false
poll_interval = 0
post_cmd = []
pre_cmd = []
rerun = false
rerun_delay = 500
send_interrupt = false
stop_on_error = false

[color]
app = ""
build = "yellow"
main = "magenta"
runner = "green"
watcher = "cyan"

[log]
main_only = false
silent = false
time = false

[misc]
clean_on_exit = false

[proxy]
app_port = 0
app_start_timeout = 0
enabled = false
proxy_port = 0

[screen]
clear_on_rebuild = false
keep_scroll = true
